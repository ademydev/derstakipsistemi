<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ders Takip Sistemi</title>
  <meta name="description" content="Hesabına bağlı, tüm cihazlarında senkron çalışan kişisel ders programı. Derslerini, konularını, ödevlerini ve çalışma planını kendin oluştur." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M20 18h24M20 32h24M20 46h14' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <script>
    /* Tema, ilk boyamadan önce uygulanır (titreme olmasın diye). */
    (function () {
      try {
        var raw = localStorage.getItem('kdp:state:v1');
        var pref = raw ? (JSON.parse(raw).settings || {}).theme : null;
        pref = pref || 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* yoksay */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe geç</a>

  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="brand__text">
          <h1>Ders Takip Sistemi</h1>
          <span class="brand__sub" id="sync-status">Senkronize ediliyor…</span>
        </span>
      </div>

      <nav class="nav" id="nav" aria-label="Bölümler">
        <button type="button" class="nav__item is-active" data-action="set-view" data-view="week">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>Haftalık Program</button>
        <button type="button" class="nav__item" data-action="set-view" data-view="today">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4"/></svg>Bugün</button>
        <button type="button" class="nav__item" data-action="set-view" data-view="school">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-4 9 4-9 4-9-4Z"/><path d="M7 12.4V17c0 1.1 2.2 2 5 2s5-.9 5-2v-4.6"/></svg>Okul Programım</button>
        <button type="button" class="nav__item" data-action="set-view" data-view="study">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h11a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2V4Z"/><path d="M6 4v16"/><path d="M10 8h5"/></svg>Çalışma Programım</button>
        <button type="button" class="nav__item" data-action="set-view" data-view="settings">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h5M13 17h7"/><circle cx="15" cy="7" r="2"/><circle cx="11" cy="17" r="2"/></svg>Ayarlar</button>
      </nav>

      <button type="button" class="icon-btn theme-toggle" data-action="toggle-theme" aria-label="Temayı değiştir" title="Temayı değiştir">
        <svg viewBox="0 0 24 24" class="icon icon--sun" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" class="icon icon--moon" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <p class="noscript">Bu uygulamanın çalışması için JavaScript gerekir. Programın hesabına kaydedilir ve tüm cihazlarında görünür.</p>
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
